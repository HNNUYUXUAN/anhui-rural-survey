name: Verify and deploy research library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-notebook.txt
            requirements-site.txt
      - name: Install notebook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-liberation
          python -m pip install --upgrade pip
          python -m pip install -r requirements-site.txt
      - name: Verify archive boundary and hashes
        run: python scripts/verify_release.py
      - name: Verify resource catalog and discovery guides
        run: python scripts/build_discovery.py --check
      - name: Execute the complete notebook
        run: python scripts/build_analysis_notebook.py --check-execution --font-mode portable
      - name: Test plotting semantics
        env:
          SURVEY_FONT_MODE: portable
          MPLBACKEND: Agg
        run: python scripts/test_plot_style.py
      - name: Build reading pages from reviewed outputs
        run: python scripts/build_site.py --output ../site
      - name: Check reading-page JavaScript
        run: node --check web/site.js
      - name: Verify reading pages
        run: python scripts/verify_site.py ../site
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ../site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
